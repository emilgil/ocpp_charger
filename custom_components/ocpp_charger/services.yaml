rest_call:
  name: REST API Call
  description: >
    Make a direct HTTP request to the EV charger's REST API.
    The response is fired as an event: ocpp_charger_rest_response.
  fields:
    method:
      name: Method
      description: HTTP method to use.
      required: true
      default: GET
      selector:
        select:
          options: [GET, POST, PUT, DELETE, PATCH]
    endpoint:
      name: Endpoint
      description: >
        Path relative to the configured base URL, e.g. /status or /settings/maxCurrent.
      required: true
      example: /status
      selector:
        text:
    params:
      name: Query Parameters
      description: Optional key/value pairs added as query string parameters.
      required: false
      example: '{"key": "value"}'
      selector:
        object:
    body:
      name: Request Body
      description: Optional request body (dict for JSON, string for plain text).
      required: false
      example: '{"maxCurrent": 16}'
      selector:
        object:

change_configuration:
  name: Change Configuration
  description: >
    Send a ChangeConfiguration command to the charger. Result is fired as
    event 'ocpp_charger_ocpp_response'. Useful for testing charger settings.
  fields:
    key:
      name: Key
      description: Configuration key (e.g. MaxCurrentValue, HeartbeatInterval)
      required: true
      example: "MaxCurrentValue"
      selector:
        text:
    value:
      name: Value
      description: Configuration value (always sent as string)
      required: true
      example: "6"
      selector:
        text:

get_configuration:
  name: Get Configuration
  description: >
    Send a GetConfiguration command to read charger settings. Result is fired
    as event 'ocpp_charger_ocpp_response'. Leave key empty to get all keys.
  fields:
    key:
      name: Key
      description: Configuration key to read (leave empty for all)
      required: false
      example: "MaxCurrentValue"
      selector:
        text:

get_composite_schedule:
  name: Get Composite Schedule
  description: >
    Ask the charger which composite charging schedule it currently applies
    (OCPP GetCompositeSchedule). Read-only. Result is fired as event
    'ocpp_charger_ocpp_response' and logged in ocpp_charger_debug.log.
  fields:
    connector_id:
      name: Connector
      description: 0 = whole charge point, 1 = connector 1.
      required: false
      default: 1
      selector:
        number:
          min: 0
          max: 1
          mode: box
    duration:
      name: Duration (seconds)
      description: How far ahead to compute the schedule.
      required: false
      default: 3600
      selector:
        number:
          min: 60
          max: 86400
          mode: box
    charging_rate_unit:
      name: Unit
      description: A (ampere) or W (watt). The Garo charger uses A.
      required: false
      default: A
      selector:
        select:
          options: [A, W]

clear_charging_profile:
  name: Clear Charging Profile
  description: >
    Remove installed charging profiles from the charger (OCPP
    ClearChargingProfile). With no filters ALL profiles are removed, which
    requires confirm_clear_all. Result is fired as event
    'ocpp_charger_ocpp_response'.
  fields:
    profile_id:
      name: Profile ID
      description: Clear only the profile with this ID.
      required: false
      selector:
        number:
          min: 0
          mode: box
    connector_id:
      name: Connector
      description: Clear only profiles on this connector (0 = charge point).
      required: false
      selector:
        number:
          min: 0
          max: 1
          mode: box
    purpose:
      name: Purpose
      description: Clear only profiles with this purpose.
      required: false
      selector:
        select:
          options: [ChargePointMaxProfile, TxDefaultProfile, TxProfile]
    stack_level:
      name: Stack level
      description: Clear only profiles at this stack level.
      required: false
      selector:
        number:
          min: 0
          max: 10
          mode: box
    confirm_clear_all:
      name: Confirm clear all
      description: >
        Must be true if no filter is given. Removes every charging profile in
        the charger.
      required: false
      default: false
      selector:
        boolean:
